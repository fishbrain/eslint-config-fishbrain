name: CI

on:
  push:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: warp-ubuntu-latest-x64-2x

    steps:
      - uses: actions/checkout@v5
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install
        run: yarn

      - name: Test configs
        run: yarn test
        env:
          CI: true

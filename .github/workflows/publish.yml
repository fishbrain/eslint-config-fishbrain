name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Must run on a GitHub-hosted runner — npm's trusted-publisher OIDC
    # exchange and `--provenance` attestations both require it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: yarn install --immutable

      - name: Pack and publish each workspace
        run: |
          set -euo pipefail
          yarn workspaces foreach -A --no-private exec sh -c '
            yarn pack
            npm publish package.tgz --access public --provenance
            rm -f package.tgz
          '

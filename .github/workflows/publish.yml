name: Publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - run: yarn config set npmAuthToken "${{ secrets.NPM_TOKEN }}"
      - run: yarn publish

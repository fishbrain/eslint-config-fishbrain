name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Must run on a GitHub-hosted runner — npm's trusted-publisher OIDC
    # exchange and `--provenance` attestations both require it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: yarn install --immutable

      - name: Pack and publish each workspace
        run: |
          set -euo pipefail
          yarn workspaces foreach -A --no-private exec sh -c '
            yarn pack
            npm publish package.tgz --access public --provenance
            rm -f package.tgz
          '

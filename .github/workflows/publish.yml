name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Must run on a GitHub-hosted runner — npm's trusted-publisher OIDC
    # exchange and `--provenance` attestations both require it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: yarn install --immutable

      - name: Pack and publish each workspace
        run: |
          set -euo pipefail
          yarn workspaces foreach -A --no-private exec sh -c '
            yarn pack
            npm publish package.tgz --access public --provenance
            rm -f package.tgz
          '
